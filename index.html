  /* Layout: one centered hero with a contact card; columns of dumbbells, barbells and protein fixed to both page edges. */

      --iron-2: #b5bfca;
      --steel: #5d6977;
      --tub: #3e86bd;
      --tub-label: #f0b94a;

    --tub: #3e86bd;

  html, body { height: 100%; }
  body {

    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overflow-x: hidden;
  }

  /* Side columns */
  .side {
    position: fixed;
    top: 0;
    bottom: 0;
    width: clamp(70px, 16vw, 240px);
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .side.left { left: 0; }
  .side.right { right: 0; }
  .deco {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    transform: translate(-50%, -50%) rotate(var(--r));
    animation: bob 6s ease-in-out var(--d) infinite alternate;
    filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .22));
  }

  .deco.bar svg { aspect-ratio: 260 / 100; }
  .deco.tub svg { aspect-ratio: 100 / 130; }
